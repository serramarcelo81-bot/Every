<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="devo.php" method="post">
        <p>
            <label for="iest">Estado:</label>
            <select name="est" id="iest">
                <option value="">---Escolha---</option>
                <optgroup label="Municípios">
                    <option value="">Cazenga</option>
                    <option  value="">Kilamba</option>
                    <option value="">Kinaxixi</option>
                </optgroup>

            </select>
        </p>

        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iprof" list="bo">
            <datalist id="bo">
                <option value="PRO">Professor</option>
                <option value="SEC">Secretário</option>
                <option value="POL">Polícia</option>
            </datalist>
        </p>

        <p>
            <label for="imen">Mensagem</label> <br>
            <textarea name="men" id="imen" rows="10" cols="30" placeholder="Sua mensagem..."></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
