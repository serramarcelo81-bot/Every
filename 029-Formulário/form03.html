<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        form{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.597);
            border-radius: 10px 0px 10px 0px;
            height: 400px;
            text-align: center;
            padding:10px;
            
            
        }
        h1,p{
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <form action="devo.php" method="post" autocomplete="on">
        <em>
            <h1>Formulário</h1>
        </em>
        <br>
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required minlength="5" maxlength="15" size="20" placeholder="Digite seu nome..." autocomplete="name">
        </p>
        <br>
        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" required placeholder="0 a 20" step="0.1" value="5">
        </p><br>
        <!-- O value define o valor inicial do campo e elimina o placeholder -->

        <!-- O step define o intervalo de valores que o campo pode receber, ele vai avançar de 0.1 em 0.1 -->
        <p>
            <label for="imes">Ano letivo:</label>
            <input type="month" name="mes" id="imes" required>
        </p>
        <br>
        <p>
            <label for="idia">Dia da prova:</label>
            <input type="date" name="dia" id="idia">
        </p>
        <br>
        <p>
            <label for="ihora">Horário da prova</label>
            <input type="time" name="hora" id="ihora" required>
        </p>
        <br>
        <p>
            <input type="submit" value="Enviar">
            <br>
            <br>
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
