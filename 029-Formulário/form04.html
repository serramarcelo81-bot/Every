<!DOCTYPE html>

<!--O fieldset serve para agrupar os campos-->



<body>
    <h1>Teste de formulário</h1>
    <form action="devo.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Informações Pessoais</legend>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" id="iemail" name="iemail" required>
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input type="tel" id="itel" name="itel" required pattern="^[0-9]{3}[0-9]{3}[0-9]{3}$">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
