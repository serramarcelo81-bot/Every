<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    
    <h1>Meu primeiro formulário</h1>
    <form autocomplete="off">
        <p><label for="inome">Nome</label>: <input type="text" name="nome" id="inome"></p>

       <!--o label serve para conectar o nome e o sobrenome com as suas respectivas caixas input atravé do "name" ou do "id" -->

        <p><label for="isobrenome">Sobrenome</label>: <input type="text" name="sobrenome" id="isobrenome"></p>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
